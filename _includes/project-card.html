{% assign p = include.project %}
<article class="project{% unless p.image %} project-noimg{% endunless %}" id="{{ p.name | slugify }}">
  {% if p.image %}
  <a class="project-img" href="{{ p.links[0].url | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ p.image | relative_url }}" alt="{{ p.image_alt }}" loading="lazy">
  </a>
  {% endif %}
  <div class="project-body">
    <h3>{{ p.name }}{% if p.subtitle %} <span class="project-sub">{{ p.subtitle }}</span>{% endif %}</h3>
    <div class="project-desc">{{ p.description | markdownify }}</div>
    {% if p.links %}
    <div class="project-links">
      {% for l in p.links %}<a class="btn{% if forloop.first %} btn-primary{% endif %}" href="{{ l.url | relative_url }}">{{ l.label }}</a>{% endfor %}
    </div>
    {% endif %}
  </div>
</article>

<ul class="links">
  {% if site.author.googlescholar %}<li><a href="{{ site.author.googlescholar }}" rel="me">Google Scholar</a></li>{% endif %}
  {% if site.author.github %}<li><a href="https://github.com/{{ site.author.github }}" rel="me">GitHub</a></li>{% endif %}
  {% if site.author.email %}<li><a href="mailto:{{ site.author.email }}">Email</a></li>{% endif %}
  {% if site.posts.size > 0 %}<li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>{% endif %}
</ul>

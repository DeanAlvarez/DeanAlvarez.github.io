# Site settings. Restart `jekyll serve` after editing this file.

title: Dean E. Alvarez
description: >-
  CS PhD candidate at UIUC studying how to make any document collection
  navigable, using Hypergraph of Text.
url: https://deanalvarez.github.io
baseurl: ""
lang: en-US
timezone: America/Chicago

author:
  name: Dean E. Alvarez
  pronouns: he/him
  bio: CS PhD candidate @ UIUC
  location: Illinois, US
  # Links shown on the home page and footer. Leave blank to hide.
  email:
  googlescholar: https://scholar.google.com/citations?user=WCSG8bwAAAAJ&hl=en
  github: DeanAlvarez
  # Name as it appears in author lists; bolded on publication entries.
  short_name: Dean E. Alvarez

# Top navigation. "Blog" is added automatically once _posts/ has a post.
navigation:
  - title: About
    url: /
  - title: Publications
    url: /publications/
  - title: Background
    url: /background/

# Publication categories, in display order (same groups as the CV).
publication_categories:
  conference: Conference Papers, Demos & Doctoral Consortium
  preprint: Preprints
  report: Workshop Proposals, Reports & Track Overviews

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: publications }
    values: { layout: publication }

permalink: /blog/:year/:title/
include: [_pages]
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - markdown_generator
  - scripts
  - vendor
  - .bundle
  - .jekyll-cache
  - node_modules

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
highlighter: rouge

# All of these ship with GitHub Pages.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

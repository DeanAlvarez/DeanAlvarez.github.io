- section: Research Experience
  entries:
    - title: Graduate Research Assistant
      when: Jan 2024 – Present
      org: University of Illinois Urbana-Champaign
      where: Advisor — Prof. ChengXiang Zhai
      note: "Hypergraph of Text: making any document collection navigable"
      bullets:
        - Proposed Hypergraph of Text (HoT), a mathematical structure for organizing and analyzing large text collections ([BigData 2024](/publication/HoT-poster-big-data))
        - "Proposed and compared methods for constructing HoT, from classic term weighting to LLM-based methods, and a metric (effort ratio) for its structural quality: simple TF-IDF baselines can match LLM-based methods ([preprint](/publication/make-any-collection-navigable))"
        - Built and open-sourced [TINK](https://github.com/TIMAN-group/TINK), an interactive toolkit for navigating collections with HoT, demonstrated at SIGIR 2025 ([demo](/publication/TINK-text-information-navigation-kit))
        - Studying conversation-enhanced browsing over HoT; presented at the CHIIR 2026 Doctoral Consortium ([paper](/publication/CHIIR-2026-conversation-enhanced-browsing))
    - title: SPI Fellow
      when: May 2023 – Aug 2023
      org: University of Illinois Urbana-Champaign
      where: Advisor — Prof. Tandy Warnow
      bullets:
        - Benchmarked _k_-core and _k_-truss community search algorithms on large networks; presented at the Illinois Summer Research Symposium
    - title: Undergraduate Researcher
      when: Fall 2021 – Spring 2023
      org: Cornell University
      where: Advisor — Prof. Chris De Sa
      bullets:
        - Studied interpolative decomposition (ID) pruning for neural network compression, first for CNN transfer learning and then for transformers such as BERT; contributed to [STAT](/publication/STAT-shrinking-transformers-after-training)
        - Explored Gibbs-sampling (MCMC) quantization of ResNets on CIFAR-10
    - title: Senior Thesis, Humanities Scholars Program
      when: Aug 2022 – May 2023
      org: Cornell University
      where: Advisor — Prof. Malte Ziewitz
      bullets:
        - Interviewed 10+ machine learning practitioners on how ethics is practiced in the tech industry; presented at the Cornell Humanities Scholars Research Conference

